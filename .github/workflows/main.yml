name: "Main"

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm install && cd frontend && npm install && cd backend && npm install

      - name: Build
        run: npm run build
